name: GitHub Actions CI Pipeline

on:
  push:
    branches:
      - dev

jobs:
  test-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: github-actions-ci-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: github-actions-ci-pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./github-actions-ci-pipeline
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/github-actions-ci:dev-${{ github.sha }}
