apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-cronjob
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}-cronjob
        spec:
          restartPolicy: Never
          containers:
            - name: busybox
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command:
                - sh
                - -c
                - |
                  echo "{{ .Values.app.message }} from CronJob"
                  date
              env:
                - name: APP_MESSAGE
                  valueFrom:
                    configMapKeyRef:
                      name: {{ .Release.Name }}-config
                      key: MESSAGE
                - name: API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secret
                      key: API_TOKEN
