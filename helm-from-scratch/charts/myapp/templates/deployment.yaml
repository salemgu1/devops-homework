apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: busybox
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - sh
            - -c
            - |
              echo "{{ .Values.app.message }}"
              echo "API Token is available from Secret"
              sleep 3600
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: MESSAGE
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: API_TOKEN
          ports:
            - containerPort: {{ .Values.app.port }}
          volumeMounts:
            - name: app-config
              mountPath: /etc/myapp/config
            - name: app-secret
              mountPath: /etc/myapp/secret
              readOnly: true
      volumes:
        - name: app-config
          configMap:
            name: {{ .Release.Name }}-config
        - name: app-secret
          secret:
            secretName: {{ .Release.Name }}-secret
